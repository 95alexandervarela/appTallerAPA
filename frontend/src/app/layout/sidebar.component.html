<aside class="sidebar-shell" aria-label="Modulos principales">
  <div class="sidebar-brand">
    <span class="brand-mark">
      <i class="pi pi-prime logo-icon" aria-hidden="true"></i>
    </span>
    <div>
      <span>Sistema de Servicio Tecnico</span>
      <strong>Taller APA</strong>
    </div>
  </div>

  <p-menu [model]="menuItems" styleClass="sidebar-menu" />

  <div class="sidebar-footer">
    @if (isUserPopoverOpen) {
      <div class="user-popover" role="dialog" aria-label="Sesion de usuario" (click)="stopUserPopoverClick($event)">
        <div class="user-popover-copy">
          <strong>{{ currentUser?.name || 'Usuario' }}</strong>
          <span>{{ currentUser?.role || 'Rol no disponible' }}</span>
        </div>

        <button type="button" class="logout-button" (click)="logout()">
          <i class="pi pi-sign-out" aria-hidden="true"></i>
          <span>Cerrar sesión</span>
        </button>
      </div>
    }

    <button
      type="button"
      class="user-bubble"
      aria-label="Abrir menu de usuario"
      [attr.aria-expanded]="isUserPopoverOpen"
      (click)="toggleUserPopover($event)"
    >
      <i class="pi pi-user"></i>
    </button>

    <small class="sidebar-copyright">
      © Almacen Pajaro Azul 2026
    </small>
  </div>
</aside>
